[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flycode"
version = "0.1.0"
description = "Hybrid autonomous coding agent with fly-inspired neural controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.61",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.0",
    "jupyter-client>=8.0",
    "pyserial>=3.5",
    "httpx>=0.25",
    "docker>=7.0",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pytest-dotenv>=0.5",
    "rich>=13.0",
    "loguru>=0.6",
    "networkx>=3.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.scripts]
flycode = "flycode.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.4",
]

research = [
    "nengo>=3.0",
    "pyarrow>=15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flycode"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
